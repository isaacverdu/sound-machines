<!--
  Ghost Admin → Settings → Code injection → Site header.
  This file is the canonical copy. Edit here, then paste the whole thing over
  the contents of the box. Three things live in it:
    1. MathJax   – renders $inline$ and $$display$$ LaTeX in posts
    2. Prism     – syntax highlighting for <pre><code class="language-python">
    3. .signal   – the "Follow the signal" block style (mirrors signal.scss)
-->

<!-- 1. MathJax -->
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    options: {
      // don't try to typeset inside code blocks or the editor's own markup
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script async id="MathJax-script"
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<!-- 2. Prism -->
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

<!-- 3. Signal blocks -->
<!-- The label is set in Playfair Display to match the site, which Ghost's
     theme has no reason to load, so fetch just the one weight it needs. -->
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap">
<style>
  .signal {
    border-left: 3px solid #990f3d;
    /* Rounded like a blockquote, as on the site. The background stays a
       translucent darkening rather than the site's #e6e3d7, because that
       colour is only right against the site's own #f0eee7 page; 3.5% black
       lands in the same place on whatever Ghost's theme uses. */
    border-radius: 0.25rem;
    background: rgba(0, 0, 0, 0.035);
    margin: 2.2rem 0;
    padding: 1rem 1.4rem 1.2rem;
    font-size: 0.95em;
  }
  /* Reads as a heading, matching the site, where this label is styled as an
     h2. Sized in em so it keeps the site's 28/20 heading-to-body ratio
     whatever base size the theme sets, and left as a <p> in the markup so it
     stays out of the post outline — the site's label is a styled div, not a
     real heading either. */
  .signal .signal-label {
    font-family: 'Playfair Display', 'Bodoni', 'Times New Roman', serif;
    font-size: 1.4em;
    font-weight: 500;
    line-height: 1.2;
    color: #990f3d;
    margin: 0 0 1rem;
  }
  .signal p:last-child { margin-bottom: 0; }
  .signal figure, .signal img { max-width: 100%; margin: 0.8rem 0; }
  .signal audio { width: 100%; margin: 0.6rem 0; }
  .signal pre { margin: 0.8rem 0; }
  /* Ghost wraps code in <pre><code>; Prism theme handles the rest. */
  .signal table { font-size: 0.9em; width: 100%; border-collapse: collapse; }
  .signal th, .signal td { padding: 0.3em 0.6em; border-bottom: 1px solid rgba(0,0,0,0.15); text-align: left; }
</style>
