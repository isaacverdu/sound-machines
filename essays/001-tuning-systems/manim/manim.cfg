# Project-wide Manim settings, read when manim runs from this folder.
# render.py passes resolution and frame rate explicitly; these values
# apply when calling manim directly without quality flags.
[CLI]
pixel_width = 1920
pixel_height = 1080
frame_rate = 30
media_dir = ./media
# Clocked updaters are closures Manim cannot hash, so cached partial
# movies could go stale after an edit. Always render fresh.
disable_caching = True
