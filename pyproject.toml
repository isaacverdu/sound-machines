[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sound-machines"
version = "0.0.1"
description = "Shared DSP, audio I/O and plotting helpers for the Sound Machines essays."
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "soundfile"]

[tool.setuptools]
packages = ["sm"]
